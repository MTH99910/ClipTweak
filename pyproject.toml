[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cliptweak"
version = "0.2.1"
description = "Native Linux video viewer with live color correction and safe FFmpeg saving"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]
license = "MIT"

[project.scripts]
cliptweak = "cliptweak.app:main"

[tool.setuptools.packages.find]
include = ["cliptweak*"]

[tool.setuptools.package-data]
cliptweak = ["resources/*.png"]
