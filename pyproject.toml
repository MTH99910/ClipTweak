[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-tint"
version = "0.1.2"
description = "Native Linux video viewer with live color correction and safe FFmpeg saving"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]
license = "MIT"

[project.scripts]
video-tint = "video_tint.app:main"

[tool.setuptools.packages.find]
include = ["video_tint*"]
